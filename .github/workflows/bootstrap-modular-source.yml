name: Bootstrap modular storefront source

on:
  push:
    branches:
      - main
    paths:
      - bootstrap/READY

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reassemble and unpack modular source
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/chunk-* > /tmp/jewelry-theme.b64
          base64 --decode /tmp/jewelry-theme.b64 > /tmp/jewelry-theme.zip
          echo "4c4b8283ebaa0390f914dba5f37fff2c72c10568b40704df709e623aafcad066  /tmp/jewelry-theme.zip" | sha256sum -c -
          unzip -t /tmp/jewelry-theme.zip
          unzip -o /tmp/jewelry-theme.zip -d .
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-modular-source.yml

      - name: Commit modular structure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Modularize storefront source"
          git push origin HEAD:main
