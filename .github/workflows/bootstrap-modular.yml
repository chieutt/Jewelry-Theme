name: Bootstrap modular storefront

on:
  push:
    paths:
      - bootstrap/READY

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Rebuild modular source
        shell: bash
        run: |
          cat bootstrap/part-* > /tmp/source.b64
          base64 --decode /tmp/source.b64 > /tmp/source.zip
          unzip -oq /tmp/source.zip -d .
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-modular.yml

      - name: Commit modular structure
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refactor storefront into assets, sections and snippets"
          git push origin main
